<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingdom Bible</title>
<meta name="description" content="Bible stories for kids and beginners, told in cut-paper pictures you can touch, with narration and music.">
<meta name="theme-color" content="#04050a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kingdom Bible">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --ink: #f5ecda;
    --soft: rgba(245, 236, 218, 0.62);
    --gold: #f0cc8a;
    --night: #04050a;
    --glass: rgba(4, 5, 10, 0.38);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  html { background: var(--night); }
  body { margin: 0; color: var(--ink); background: var(--night); font-family: 'Literata', Georgia, serif;
    -webkit-font-smoothing: antialiased; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #stage { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* Little hands press and hold: no link previews, picture menus or text selection popping up.
     The Bible verses stay selectable, for grown-ups who want to copy them. */
  body { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .sheet, .sheet * { -webkit-user-select: text; user-select: text; }
  input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }

  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  #scrim { position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: linear-gradient(90deg, rgba(4,5,10,0.8) 0%, rgba(4,5,10,0.6) 32%, rgba(4,5,10,0.12) 60%, rgba(4,5,10,0) 75%); }

  /* ---- Slides: only the current one is shown; the rest wait above or below it. */
  #deck { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .slide { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 max(16px, 7vw, env(safe-area-inset-left));
    opacity: 0; filter: blur(5px); visibility: hidden;
    transition: opacity 0.7s ease, transform 1s cubic-bezier(0.2, 0.7, 0.2, 1), filter 0.7s ease, visibility 0s linear 1s; }
  .slide.below { transform: translateY(36px); }
  .slide.above { transform: translateY(-36px); }
  .slide.on { opacity: 1; filter: none; transform: none; visibility: visible;
    transition-delay: 0.3s, 0.3s, 0.3s, 0s; transition-duration: 1.1s, 1.3s, 1.1s, 0s; }
  .col { max-width: 34rem; text-shadow: 0 1px 18px rgba(0,0,0,0.55); }
  .slide.on .col { pointer-events: auto; }

  .kicker, .eyebrow { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); }
  h1, h2 { font-family: 'Cormorant Garamond', serif; font-weight: 500; letter-spacing: 0.005em; margin: 0; }
  .cover h1 { font-size: clamp(3.2rem, 9vw, 6.4rem); line-height: 0.95; margin: 0.9rem 0 1.1rem; }
  .sub { font-style: italic; color: var(--soft); font-size: 1.1rem; }
  .title h2 { font-size: clamp(2.8rem, 7vw, 5.2rem); line-height: 1; margin-top: 0.8rem; }
  .end h2 { font-size: clamp(2.3rem, 5vw, 3.5rem); font-style: italic; margin: 0.6rem 0 1rem; }
  .credit { color: var(--soft); font-size: 0.85rem; margin-top: 2.5rem; }

  .mini { margin-bottom: 1.6rem; opacity: 0.85; }
  .beat { font-size: clamp(1.45rem, 2.3vw, 2rem); line-height: 1.5; margin: 0; max-width: 30rem; }

  .begin { margin-top: 3rem; }
  button { font: inherit; color: var(--ink); cursor: pointer; }
  .begin, .source .toggle { display: inline-flex; align-items: center; gap: 0.55em;
    color: var(--gold); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
    padding: 0.7em 1.3em; border: 1px solid rgba(240,204,138,0.45); border-radius: 999px; background: var(--glass);
    transition: background 0.2s, border-color 0.2s; }
  .begin:hover, .source .toggle:hover { background: rgba(240,204,138,0.12); border-color: var(--gold); }
  a.begin { text-decoration: none; }
  button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .source { margin-top: 2.2rem; font-size: 0.95rem; }
  .source .toggle { padding: 0.55em 1.1em; letter-spacing: 0.14em; }
  .source .toggle::before { content: '+'; font-size: 1.15em; font-weight: 400; line-height: 1; }
  .source.open .toggle::before { content: '–'; }
  .sheet[hidden] { display: none; }
  body.verses-open #hint { visibility: hidden; }
  /* The verses open in their own panel over the picture, so the story's words don't move. */
  .sheet { position: fixed; z-index: 6; pointer-events: auto; left: max(16px, 7vw, env(safe-area-inset-left)); width: min(36rem, calc(100% - 2 * max(16px, 7vw)));
    bottom: max(84px, calc(3vh + 64px), calc(env(safe-area-inset-bottom) + 76px)); max-height: min(62vh, calc(100% - 120px));
    display: flex; flex-direction: column; padding: 16px 18px 6px; border-radius: 20px; border: 1px solid rgba(240,204,138,0.35);
    background: rgba(10,11,20,0.93); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 18px 50px rgba(0,0,0,0.55);
    text-shadow: none; animation: sheetin 0.25s ease-out; }
  @keyframes sheetin { from { opacity: 0; transform: translateY(14px); } }
  .sheet .sheethead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 0.8rem;
    font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: var(--ink); }
  .sheet .shut { width: 38px; height: 38px; flex: none; border-radius: 50%; border: 1px solid rgba(240,204,138,0.45); background: transparent;
    color: var(--gold); display: grid; place-items: center; padding: 0; }
  .sheet .shut::before, .sheet .shut::after { content: ''; grid-area: 1 / 1; width: 15px; height: 1.6px; border-radius: 1px; background: currentColor; transform: rotate(45deg); }
  .sheet .shut::after { transform: rotate(-45deg); }
  .sheet .shut:hover { background: rgba(240,204,138,0.12); }
  .verses { padding: 0 0.6rem 0 1.1rem; border-left: 1px solid rgba(240,204,138,0.35); min-height: 0;
    overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(240,204,138,0.4) transparent; }
  .verses p { color: var(--soft); line-height: 1.7; margin: 0 0 0.9em; }
  .verses sup { font-size: 0.7em; font-weight: 600; color: var(--gold); margin-right: 0.35em; }

  /* ---- Getting around: day dots on the right, back/next at the bottom right. */
  #dots { position: fixed; z-index: 3; right: max(14px, 2.2vw, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 14px; transition: opacity 0.8s; }
  #dots button { width: 9px; height: 9px; padding: 0; border-radius: 99px; border: 1px solid rgba(240,204,138,0.65);
    background: transparent; transition: height 0.5s cubic-bezier(0.2, 0.7, 0.2, 1), background 0.4s; }
  #dots button.on { height: 30px; background: var(--gold); }
  #nav { position: fixed; z-index: 3; right: max(14px, 2.2vw, env(safe-area-inset-right)); bottom: max(16px, 3vh, calc(env(safe-area-inset-bottom) + 8px));
    display: flex; gap: 10px; }
  #nav button, #nav .navlink { width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(240,204,138,0.45);
    background: var(--glass); color: var(--gold); display: grid; place-items: center;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: opacity 0.4s, background 0.2s; }
  #nav button:hover:not(:disabled) { background: rgba(240,204,138,0.14); }
  #nav button:disabled { opacity: 0.25; cursor: default; }
  #nav svg { width: 18px; height: 18px; }
  #nav .gap { width: 6px; }
  #nav .toggle[aria-pressed="true"] { background: rgba(240,204,138,0.2); border-color: var(--gold); }
  #sound[aria-pressed="true"] .off, #sound[aria-pressed="false"] .on { display: none; }

  /* ---- Stickers: round cut-outs of the paintings with a white paper edge. */
  .sticker { flex: none; border-radius: 50%; background-repeat: no-repeat; background-color: #2a2330;
    border: 4px solid #fbf6ea; box-shadow: 0 6px 18px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.4); transform: rotate(-4deg); }
  .sticker.lamb { background-color: #f6efdc; background-size: 74%; background-position: 50% 58%; }
  .sticker.lamb.missing { filter: grayscale(1) brightness(0.35); opacity: 0.45; box-shadow: none; }
  .book .lambs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -0.3rem 0 1.4rem; }
  .book .lambs span { color: var(--soft); font-size: 0.85rem; margin-right: 0.4rem; }
  .book .lambs .sticker { border-width: 2px; transform: none; }
  #stickers { position: relative; }
  #stickers .count { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--gold); color: var(--night); font-size: 0.68rem; font-weight: 600; line-height: 18px; text-align: center; }
  #stickers .count:empty { display: none; }
  #stickers.bump { animation: bump 0.5s ease; }
  @keyframes bump { 40% { transform: scale(1.22); } }
  .toast { position: fixed; z-index: 8; left: 50%; top: max(9vh, calc(env(safe-area-inset-top) + 16px)); display: flex; align-items: center; gap: 18px;
    padding: 14px 26px 14px 14px; border-radius: 999px; background: rgba(4,5,10,0.72); border: 1px solid rgba(240,204,138,0.45);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); pointer-events: none;
    transform: translate(-50%, -20px) scale(0.9); opacity: 0; transition: transform 0.45s cubic-bezier(0.2, 1.4, 0.3, 1), opacity 0.3s; }
  .toast .place-art { flex: none; border-radius: 14px; overflow: hidden; border: 3px solid var(--gold); box-shadow: 0 8px 22px rgba(0,0,0,0.45);
    transition: transform 0.7s cubic-bezier(0.5, 0, 0.7, 0.4); animation: pop 0.6s cubic-bezier(0.2, 1.6, 0.4, 1); }
  .toast .place-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .toast.in { transform: translate(-50%, 0) scale(1); opacity: 1; }
  .toast .sticker { transition: transform 0.7s cubic-bezier(0.5, 0, 0.7, 0.4); animation: pop 0.6s cubic-bezier(0.2, 1.6, 0.4, 1); }
  .toast.out { background: transparent; border-color: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .toast.out .words { opacity: 0; }
  .toast .words { transition: opacity 0.3s; }
  .toast .name { font-family: 'Cormorant Garamond', serif; font-size: 1.7rem; line-height: 1.1; }
  @keyframes pop { 0% { transform: scale(0.2) rotate(-30deg); } 100% { transform: scale(1) rotate(-4deg); } }
  /* A phone on its side: a smaller title and a shorter "Start here" card, so it clears the tab bar. */
  @media (max-height: 500px) and (min-width: 561px) {
    #home .head h1 { font-size: 2.3rem; }
    #home .hero { margin-top: 0.9rem; height: max(150px, calc(100vh - 225px)); }
    #home .hero .sub { display: none; }
    #home .hero h2 { font-size: 2rem; margin-bottom: 0.7rem; }
  }
  @media (max-width: 600px) { .kingdom .top .eyebrow { font-size: 0.66rem; letter-spacing: 0.18em; } }
  @media (max-width: 560px) {
    .toast { gap: 12px; padding: 10px 20px 10px 10px; max-width: calc(100vw - 24px); }
    .toast .sticker { border-width: 3px; }
    .toast .name { font-size: 1.3rem; }
  }

  .book { position: fixed; inset: 0; z-index: 9; overflow-y: auto; overscroll-behavior: contain; background: rgba(4,5,10,0.78);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; transition: opacity 0.3s;
    padding: max(48px, calc(env(safe-area-inset-top) + 24px)) max(16px, 5vw) max(48px, calc(env(safe-area-inset-bottom) + 24px)); }
  .book.in { opacity: 1; }
  .book .page { max-width: 62rem; margin: 0 auto; position: relative; }
  .book h2 { font-size: clamp(2.4rem, 6vw, 3.6rem); margin: 0.3rem 0 1.6rem; }
  .book h3 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 1.8rem; margin: 2rem 0 1rem; color: var(--gold); }
  .book h3 span { color: var(--soft); font-family: 'Literata', serif; font-size: 0.9rem; }
  .book .close { position: absolute; top: 0; right: 0; width: 46px; height: 46px; border-radius: 50%; font-size: 1.6rem; line-height: 1;
    border: 1px solid rgba(240,204,138,0.45); background: var(--glass); color: var(--gold); }
  /* The close buttons' × is drawn, not typed: the font's × sits below the middle of the circle. */
  :is(.book, .game, .kingdom, .recorder) .close { display: grid; place-items: center; padding: 0; }
  :is(.book, .game, .kingdom, .recorder) .close::before, :is(.book, .game, .kingdom, .recorder) .close::after {
    content: ''; grid-area: 1 / 1; width: 18px; height: 1.6px; border-radius: 1px; background: currentColor; transform: rotate(45deg); }
  :is(.book, .game, .kingdom, .recorder) .close::after { transform: rotate(-45deg); }
  .book .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 22px 14px; }
  .book figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .book figure:nth-child(even) .sticker { transform: rotate(5deg); }
  .book figcaption { font-size: 0.85rem; line-height: 1.35; }
  .book .missing figcaption { color: var(--soft); font-style: italic; font-size: 0.78rem; }
  .book .blank { width: 104px; height: 104px; border-radius: 50%; border: 2px dashed rgba(240,204,138,0.4); display: grid; place-items: center;
    color: rgba(240,204,138,0.55); font-family: 'Cormorant Garamond', serif; font-size: 2.4rem; }

  /* ---- Games: open over the story, full screen. */
  .game { position: fixed; inset: 0; z-index: 9; background-size: cover; background-color: var(--night); opacity: 0; transition: opacity 0.35s;
    display: flex; flex-direction: column; overflow: hidden;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .game.in { opacity: 1; }
  .game::before { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(4,5,10,0.8) 0%, rgba(4,5,10,0.6) 16%, rgba(4,5,10,0.25) 30%, rgba(4,5,10,0) 42%, rgba(4,5,10,0) 55%, rgba(4,5,10,0.55) 100%); }
  .game > * { position: relative; }
  .game .top { display: flex; align-items: center; gap: 14px; }
  .game .title { flex: 1; min-width: 0; text-shadow: 0 1px 14px rgba(0,0,0,0.6); }
  /* Narrow phones: the count goes on its own line under the title, so the title has room. */
  @media (max-width: 600px) {
    .game .top { display: grid; grid-template-columns: 1fr auto; column-gap: 12px; row-gap: 8px; align-items: start; }
    .game .top .title { grid-column: 1; grid-row: 1; }
    .game .top .close { grid-column: 2; grid-row: 1; }
    .game .top .progress { grid-column: 1 / -1; grid-row: 2; justify-self: start; font-size: 0.72rem; padding: 0.45em 0.9em; }
    .game h2 { font-size: 1.75rem; }
  }
  .game h2 { font-size: clamp(1.8rem, 5vw, 2.8rem); }
  .game .progress { color: var(--gold); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 0.5em 1em; border-radius: 999px; background: var(--glass); border: 1px solid rgba(240,204,138,0.4); white-space: nowrap; }
  .game .close { width: 46px; height: 46px; border-radius: 50%; font-size: 1.6rem; line-height: 1; flex: none;
    border: 1px solid rgba(240,204,138,0.45); background: var(--glass); color: var(--gold); }
  .game .say { margin: 0.6rem 0 0; max-width: 34rem; font-size: clamp(1.05rem, 2.2vw, 1.3rem); line-height: 1.45;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 1px 14px rgba(0,0,0,0.8); }
  .game .tray { margin-top: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(8px, 2vw, 18px); padding-bottom: 6px; }
  .game .piece { width: clamp(72px, min(12vw, 15vh), 118px); aspect-ratio: 1; border-radius: 22px; border: 3px solid #fbf6ea; background: rgba(251,246,234,0.88);
    box-shadow: 0 8px 20px rgba(0,0,0,0.35); padding: 8px; display: grid; place-items: center; cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.2, 1.4, 0.4, 1), box-shadow 0.25s, opacity 0.6s; }
  .game .piece img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .game .piece:hover { transform: translateY(-3px); }
  .game .piece.picked { transform: translateY(-10px) scale(1.08); box-shadow: 0 0 0 4px var(--gold), 0 14px 26px rgba(0,0,0,0.4); }
  .game .piece.nope { animation: nope 0.4s ease; }
  .game .piece.gone { transform: translate(var(--dx), var(--dy)) scale(0.12); opacity: 0; pointer-events: none;
    transition: transform 0.7s cubic-bezier(0.5, -0.3, 0.6, 1), opacity 0.7s ease-in; }
  @keyframes nope { 20%, 60% { transform: translateX(-8px) rotate(-4deg); } 40%, 80% { transform: translateX(8px) rotate(4deg); } }
  .game .won { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.8); opacity: 0; text-align: center;
    width: min(26rem, calc(100% - 32px)); padding: 28px 24px; border-radius: 28px; background: rgba(4,5,10,0.82);
    border: 1px solid rgba(240,204,138,0.5); transition: transform 0.45s cubic-bezier(0.2, 1.5, 0.4, 1), opacity 0.3s; }
  .game .won.in { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .game .won .sticker { margin: 0 auto 14px; }
  .game .won h3 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 2.6rem; margin: 0.2rem 0; }
  .game .won p { color: var(--soft); line-height: 1.5; }
  .game .won .starts { justify-content: center; margin-top: 1.4rem; }
  /* A phone on its side: a smaller badge and tighter card, so it all fits on the screen. */
  @media (max-height: 500px) {
    .game .won { padding: 16px 20px; width: min(30rem, calc(100% - 32px)); }
    .game .won .sticker { width: 72px !important; height: 72px !important; margin-bottom: 6px; }
    .game .won .sticker.emoji { font-size: 36px !important; }
    .game .won h3 { font-size: 2rem; }
    .game .won p { margin: 0.3rem 0; }
    .game .won .starts { margin-top: 0.7rem; }
  }
  .game .item { position: absolute; transform: translate(-50%, -50%) scale(var(--size, 1)); border: 0; padding: 0; background: none; cursor: pointer; }
  .game .item.star { width: 46px; height: 46px; background: #c9cfe6; opacity: 0.55; filter: drop-shadow(0 0 4px rgba(255,255,255,0.4));
    clip-path: polygon(50% 0, 61% 38%, 100% 50%, 61% 62%, 50% 100%, 39% 62%, 0 50%, 39% 38%); animation: twinkle 2.6s ease-in-out infinite var(--delay); }
  .game .item.star.got { background: #fff1b8; opacity: 1; filter: drop-shadow(0 0 14px #ffd770) drop-shadow(0 0 30px rgba(255,215,112,0.7)); animation: shine 0.5s ease-out; }
  @keyframes twinkle { 50% { opacity: 0.3; } }
  @keyframes shine { 0% { transform: translate(-50%, -50%) scale(0.6); } 60% { transform: translate(-50%, -50%) scale(1.6); } }
  .game .item.bubble { width: 54px; height: 54px; border-radius: 50%; border: 2px solid rgba(225,245,255,0.85);
    background: radial-gradient(circle at 32% 30%, rgba(255,255,255,0.9) 0 12%, rgba(200,235,255,0.15) 13%); animation: bob 5s ease-in-out infinite var(--delay); }
  .game .item.bubble.got { animation: burst 0.35s ease-out forwards; }
  @keyframes bob { 50% { margin-top: -26px; margin-left: 10px; } }
  @keyframes burst { to { transform: translate(-50%, -50%) scale(1.8); opacity: 0; } }
  .game .item.lamb { width: 64px; opacity: 0.92; animation: peek 3.4s ease-in-out infinite var(--delay); }
  .game .item.lamb img { width: 100%; display: block; pointer-events: none; }
  .game .item.lamb.got { opacity: 1; animation: hop 0.6s ease-out; filter: drop-shadow(0 0 14px #ffe7a0); }
  @keyframes peek { 50% { margin-top: 4px; } }
  @keyframes hop { 40% { margin-top: -30px; } }
  .game .tally { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); font-family: 'Cormorant Garamond', serif; font-size: clamp(4rem, 14vw, 7rem);
    color: #fff3d6; text-shadow: 0 0 30px rgba(255,215,112,0.8), 0 2px 12px rgba(0,0,0,0.6); pointer-events: none; }
  .game .tally.pop { animation: tally 0.45s cubic-bezier(0.2, 1.6, 0.4, 1); }
  @keyframes tally { 0% { transform: translateX(-50%) scale(0.4); } 100% { transform: translateX(-50%) scale(1); } }

  /* The games in play.js play on a field over the picture; a backdrop fades the picture into another. */
  .game .top, .game .say, .game .tray { z-index: 2; }
  .game .won { z-index: 4; }
  .game .confetti { z-index: 5; }
  @media (max-height: 520px) { .game h2 { font-size: 1.7rem; margin-top: 0.2rem; } .game .say { font-size: 1rem; margin-top: 0.3rem; } }
  .game .field { position: absolute; inset: 0; z-index: 1; touch-action: none; user-select: none; -webkit-user-select: none; }
  .game .backdrop { position: absolute; inset: 0; z-index: -1; background-size: cover; opacity: 0; transition: opacity 0.9s ease; }
  .game .backdrop.in { opacity: 1; }
  .game .field > * { position: absolute; transform: translate(-50%, -50%); }
  .game .field img { display: block; pointer-events: none; }
  .game .field button:not(.piece) { border: 0; padding: 0; background: none; cursor: pointer; }
  .game .field.shake { animation: shake 0.45s ease; }
  @keyframes pulse { 50% { scale: 1.18; } }
  @keyframes wiggle { 20%, 60% { rotate: -12deg; } 40%, 80% { rotate: 12deg; } }
  @keyframes shake { 20% { translate: -6px 3px; } 40% { translate: 6px -3px; } 60% { translate: -4px 2px; } 80% { translate: 3px -1px; } }

  /* Which Day? */
  .game .daybox { left: 50%; width: min(620px, 86%); transform: translateX(-50%); border: 3px dashed rgba(240,204,138,0.85); border-radius: 26px;
    background: rgba(10,12,20,0.38); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px 12px; }
  .game .daylabel { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.5rem, 4.4vw, 2.6rem); line-height: 1.1; color: #fff3d6; text-shadow: 0 2px 14px rgba(0,0,0,0.6); }
  .game .daybox .inside { display: flex; gap: 10px; min-height: calc(var(--p) * 0.75); flex-wrap: wrap; justify-content: center; }
  .game .daybox .piece { position: relative; width: calc(var(--p) * 0.75); height: calc(var(--p) * 0.75); padding: 5px; animation: pop 0.35s ease-out; }
  .game .pool { left: 50%; top: auto; bottom: 0; transform: translateX(-50%); width: 96%; display: flex; flex-wrap: wrap; justify-content: center;
    gap: clamp(8px, 1.6vw, 14px); padding-bottom: 6px; }
  .game .pool { align-items: center; }
  .game .pool .piece { position: relative; touch-action: none; width: var(--p); height: var(--p); padding: 6px; }
  .game .piece.held { z-index: 3; transform: scale(1.12); box-shadow: 0 0 0 4px var(--gold), 0 18px 30px rgba(0,0,0,0.45); transition: none; }

  /* Animal Memory */
  .game .cards { left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: repeat(var(--cols), var(--c)); gap: 10px; }
  .game .card { position: relative; width: var(--c); aspect-ratio: 1; transform-style: preserve-3d; transition: transform 0.4s ease; }
  .game .card.up { transform: rotateY(180deg); }
  .game .card .back, .game .card .face { position: absolute; inset: 0; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border: 3px solid #fbf6ea; box-shadow: 0 6px 16px rgba(0,0,0,0.35); }
  .game .card .back { background: radial-gradient(circle at 30% 30%, #8fcf6a, #4c8a3c); }
  .game .card .back::after { content: '❦'; position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,250,230,0.7); font-size: calc(var(--c) * 0.4); }
  .game .card .face { background: rgba(251,246,234,0.95); transform: rotateY(180deg); display: grid; place-items: center; }
  .game .card .face img { width: 86%; height: 86%; object-fit: contain; }
  .game .card.matched .face { box-shadow: 0 0 0 4px var(--gold), 0 0 26px rgba(255,215,112,0.7); }

  /* Float the Basket */
  .game .basket { filter: drop-shadow(0 8px 10px rgba(0,0,0,0.35)); }
  .game .drift { filter: drop-shadow(0 6px 8px rgba(0,0,0,0.3)); transition: opacity 0.4s; }
  .game .drift.bumped { opacity: 0.55; }
  .game .drift.got { animation: gotit 0.5s ease-out forwards; }
  @keyframes gotit { to { scale: 1.7; opacity: 0; } }

  /* Frog Frenzy */
  .game .frog { animation: popup 0.25s cubic-bezier(0.2, 1.6, 0.4, 1); filter: drop-shadow(0 6px 8px rgba(0,0,0,0.35)); }
  .game .frog img { width: 100%; }
  .game .frog.caught { animation: leapaway 0.7s ease-in forwards; pointer-events: none; }
  .game .frog.away { animation: hopoff 0.6s ease-in forwards; pointer-events: none; }
  @keyframes popup { from { scale: 0.2; } }
  @keyframes leapaway { 40% { translate: 0 -120px; rotate: -20deg; } 100% { translate: 0 -60vh; scale: 0.3; opacity: 0; } }
  @keyframes hopoff { 50% { translate: 40px -40px; } 100% { translate: 90px 10px; opacity: 0; } }

  /* Part the Sea */
  .game .trail { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(#fff, rgba(160,220,255,0.6) 50%, transparent 70%);
    pointer-events: none; animation: trail 0.7s ease-out forwards; }
  @keyframes trail { to { scale: 2.4; opacity: 0; } }
  .game .walker { filter: drop-shadow(0 0 6px #fff3c4) drop-shadow(0 0 16px rgba(255,215,112,0.8)); animation: popup 0.3s ease-out; }
  .game .walker.going { filter: drop-shadow(0 6px 8px rgba(0,0,0,0.4)); }
  .game .walker::before { content: ''; position: absolute; left: 0; right: 0; bottom: -10%; height: 30%; border-radius: 50%; z-index: -1;
    background: radial-gradient(closest-side, rgba(255,232,160,0.85), rgba(255,232,160,0)); }
  .game .walker.going::before { opacity: 0; transition: opacity 0.4s; }
  .game .walker img { width: 100%; }
  .game .walker:not(.going) { animation: popup 0.3s ease-out, pulse 1.6s ease-in-out infinite 0.3s; }

  /* To the Beach */
  .game .light { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(#fff8dc, rgba(255,226,140,0.5) 55%, transparent 72%); opacity: 0.45; pointer-events: none; }
  .game .light.next { opacity: 1; animation: pulse 1.1s ease-in-out infinite; }
  .game .light.lit { opacity: 1; background: radial-gradient(#fff, #ffd770 50%, transparent 72%); box-shadow: 0 0 22px #ffd770; }
  .game .swimmer { filter: drop-shadow(0 10px 14px rgba(0,0,0,0.4)); }
  .game .tumble { animation: tumble 1.2s ease-out forwards; }
  @keyframes tumble { 0% { scale: 0.3; } 50% { translate: 60px -90px; rotate: 200deg; } 100% { translate: 110px 20px; rotate: 360deg; scale: 1.2; } }

  /* March and Shout */
  .game .marcher { pointer-events: none; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.35)); transition: opacity 0.4s; }
  .game .marcher img { width: 100%; }
  .game .marcher.step img { animation: clop 0.36s ease-in-out infinite; }
  .game .marcher.cheer img { animation: hop 0.5s ease-out 3; }
  .game .holdhint { bottom: 6%; top: auto; left: 50%; padding: 0.7em 1.4em; border-radius: 999px; background: var(--glass); border: 1px solid rgba(240,204,138,0.6);
    color: var(--gold); font-size: 0.85rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; pointer-events: none;
    animation: pulse 1.4s ease-in-out infinite; transition: opacity 0.4s; }
  .game .field > .holdhint { transform: translateX(-50%); }
  .game .holdhint.gone { opacity: 0; }
  .game .field button.shout { left: 50%; top: 62%; padding: 0.5em 1.4em; border-radius: 999px; font-family: 'Cormorant Garamond', serif; font-weight: 600;
    font-size: clamp(2.4rem, 9vmin, 4.2rem); color: #3a2208; background: radial-gradient(circle at 40% 30%, #fff3c4, #f0c050 60%, #c98b1c);
    box-shadow: 0 0 0 5px rgba(255,243,214,0.85), 0 0 40px rgba(255,215,112,0.9), 0 14px 30px rgba(0,0,0,0.45); animation: popup 0.4s cubic-bezier(0.2, 1.6, 0.4, 1), pulse 1.1s ease-in-out infinite 0.4s; z-index: 5; }
  .game .field button.shout.gone { animation: burst 0.6s ease-out forwards; }
  .game .field button.shout[hidden] { display: none; }

  /* Fill the Baskets */
  .game .shelf { display: flex; gap: 4px; padding: 6px 8px; border-radius: 14px; background: var(--glass); }
  .game .shelf i { width: clamp(16px, 5.4vw, 30px); aspect-ratio: 1; border-radius: 50%; border: 2px dashed rgba(255,243,214,0.7); }
  .game .shelf i.full { border: 0; background: url("art/props/fullbasket.png") center / contain no-repeat; animation: pop 0.35s ease-out; scale: 1.25; }
  .game .catcher { pointer-events: none; filter: drop-shadow(0 10px 12px rgba(0,0,0,0.4)); }
  .game .catcher img { width: 100%; }
  .game .catcher.bump { animation: pulse 0.3s ease-out; }
  .game .crumb { filter: drop-shadow(0 5px 6px rgba(0,0,0,0.35)); animation: popup 0.3s ease-out; transition: left 0.4s ease-in, top 0.4s ease-in, scale 0.4s; }
  .game .crumb img { width: 100%; }
  .game .crumb.taken { scale: 0.5; pointer-events: none; z-index: 3; }
  .game .shelf.sheaves i.full { background-image: url("art/props/sheaf.png"); }
  .game .stalk:not(.purpose) { filter: drop-shadow(0 0 5px rgba(255,248,215,0.95)) drop-shadow(0 4px 5px rgba(0,0,0,0.4)); }
  .game .stalk.purpose { filter: drop-shadow(0 0 14px rgba(255,222,140,0.95)) drop-shadow(0 5px 6px rgba(0,0,0,0.35)); }
  .game .stalk.purpose:not(.taken) img { animation: pulse 1.2s ease-in-out infinite; }
  .game .stalk.gone { opacity: 0; transition: opacity 0.4s; }

  /* Find the Lamb */
  .game .field > .dark { inset: 0; transform: none; pointer-events: none; z-index: 2; transition: opacity 0.8s;
    background: radial-gradient(circle at var(--x) var(--y), rgba(255,226,150,0.08) 0, rgba(5,8,22,0) calc(var(--r) * 0.7), rgba(5,8,22,0.94) calc(var(--r) * 1.15)); }
  .game .dark.lit { opacity: 0; }
  .game .hider { filter: drop-shadow(0 5px 6px rgba(0,0,0,0.4)); z-index: 1; }
  .game .hider img { width: 100%; }
  .game .hider.hop { animation: hop 0.5s ease-out; }
  .game .hider.peek img { animation: wiggle 0.6s ease-in-out; }
  .game .hider.found { z-index: 4; animation: pulse 0.8s ease-in-out 2; filter: drop-shadow(0 0 14px #fff3c4) drop-shadow(0 0 30px rgba(255,215,112,0.9)); }

  /* Listen and Follow */
  .game .tablet { filter: drop-shadow(0 8px 10px rgba(0,0,0,0.4)); transition: filter 0.15s, scale 0.15s; touch-action: none; }
  .game .tablet img { width: 100%; }
  .game .tablet.lit { scale: 1.1; filter: drop-shadow(0 0 10px var(--glow)) drop-shadow(0 0 28px var(--glow)) brightness(1.25); }
  .game .tablet.nope { animation: wiggle 0.45s; }
  .game .field.watching .tablet:not(.lit) { filter: drop-shadow(0 8px 10px rgba(0,0,0,0.4)) brightness(0.8); }

  /* Wind and Fire */
  .game .headglow { border-radius: 50%; pointer-events: none; background: radial-gradient(closest-side, rgba(255,240,190,0.55), rgba(255,220,140,0.15) 60%, transparent);
    animation: pulse 1.6s ease-in-out infinite; transition: opacity 0.6s; }
  .game .headglow.on { animation: none; background: radial-gradient(closest-side, rgba(255,200,90,0.75), rgba(255,170,60,0.2) 60%, transparent); }
  .game .headglow.gone { opacity: 0; }
  .game .flame { pointer-events: none; opacity: 0; scale: 0.2; transition: opacity 0.4s, scale 0.5s cubic-bezier(0.2, 1.6, 0.4, 1);
    filter: drop-shadow(0 0 8px #ffd27a) drop-shadow(0 0 18px rgba(255,170,60,0.8)); }
  .game .flame.on { opacity: 1; scale: 1; animation: flicker 0.9s ease-in-out infinite 0.5s; }
  @keyframes flicker { 50% { scale: 1.08 0.94; } }
  .game .gust { width: 46px; height: 10px; border-radius: 999px; pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(255,250,225,0.85), transparent); animation: gust 0.8s ease-out forwards; }
  @keyframes gust { to { opacity: 0; scale: 2.2 0.6; } }

  /* Build the Altar */
  .game .slot { border: 2px dashed rgba(255,243,214,0.75); border-radius: 8px; background: rgba(10,12,20,0.25); pointer-events: none; }
  .game .slot.filled { border-color: transparent; background: none; }
  .game .field > .piece.laid { position: absolute; padding: 0; background: none; border: 0; box-shadow: none; pointer-events: none; z-index: 2;
    transition: left 0.35s ease-in, top 0.35s ease-in; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4)); }
  .game .field > .piece.laid img { width: 100%; }
  .game .piece.laid.wet img { filter: brightness(0.8) saturate(1.2) hue-rotate(-8deg); }
  .game .field > .stonepile { left: 50%; top: auto; bottom: 10px; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: min(96%, 560px); }
  .game .field > .stonepile.side { left: max(12px, env(safe-area-inset-left)); bottom: auto; transform: none; width: calc(3 * clamp(46px, 13vmin, 70px) + 12px); justify-content: flex-start; }
  .game .stonepile .piece { position: relative; width: clamp(46px, 13vmin, 70px); height: clamp(46px, 13vmin, 70px); padding: 4px; }
  .game .ditch { border-radius: 50%; background: rgba(60,40,20,0.35); border: 2px solid rgba(80,55,30,0.5); overflow: hidden; pointer-events: none; z-index: 1; }
  .game .water { --fill: 0; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(closest-side, #8fd0ff, #3f7fd0);
    opacity: calc(var(--fill) * 0.9); transition: opacity 0.8s; }
  .game .wood { pointer-events: none; z-index: 3; transition: opacity 0.6s; filter: sepia(0.6) brightness(0.8) drop-shadow(0 4px 4px rgba(0,0,0,0.4)); }
  .game .field button.jar { z-index: 4; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.4)); animation: pulse 1.4s ease-in-out infinite; transform-origin: 50% 70%; }
  .game .field button.jar img { width: 100%; }
  .game .field button.jar.pouring { animation: pour 0.9s ease-in-out; }
  .game .field button.jar[hidden], .game .field .praybtn[hidden] { display: none; }
  @keyframes pour { 40%, 70% { rotate: -50deg; translate: -30px 10px; } }
  .game .field .praybtn { z-index: 5; font-size: 1.1rem; padding: 0.8em 2.2em; animation: popup 0.4s ease-out, pulse 1.4s ease-in-out infinite 0.4s; }
  .game .field > .skyfire { left: 50%; top: 0; width: 34%; height: 70%; transform: translateX(-50%); pointer-events: none; z-index: 6; transform-origin: top;
    background: linear-gradient(180deg, rgba(255,250,220,0), #ffe9a8 30%, #ffb347 70%, rgba(255,120,40,0)); filter: blur(6px);
    animation: skyfire 1.6s ease-in forwards; }
  @keyframes skyfire { 0% { scale: 1 0; opacity: 0; } 35% { scale: 1 1; opacity: 1; } 100% { scale: 1.6 1.1; opacity: 0; } }
  .game .burn { transition: opacity 0.8s; opacity: 0; }

  /* Down the Wall */
  .game .field > .rope { transform: translateX(-50%); width: 3px; background: linear-gradient(90deg, #8a6a3e, #d8b77c, #8a6a3e); pointer-events: none; z-index: 2; }
  .game .hanging { pointer-events: none; z-index: 3; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.5)); transform-origin: 50% 0; }
  .game .hanging img { width: 100%; }
  .game .hanging.swing img { animation: wiggle 1.4s ease-in-out infinite; }
  .game .hanging.spotted img { animation: nope 0.5s; }
  .game .guardwalk { pointer-events: none; z-index: 4; opacity: 0; transition: opacity 0.4s; filter: drop-shadow(0 0 12px rgba(255,210,120,0.8)); }
  .game .guardwalk.on { opacity: 1; }
  .game .guardwalk img { width: 100%; }
  .game .field > .beam { transform: translateX(-50%); pointer-events: none; z-index: 1; opacity: 0; transition: opacity 0.3s;
    background: linear-gradient(180deg, rgba(255,226,150,0.55), rgba(255,226,150,0.12) 70%, transparent); clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%); }
  .game .field > .beam.on { opacity: 1; }

  /* Drown Out Haman */
  .game .field > .megillah { left: 0; right: 0; transform: translateY(-50%); pointer-events: none; z-index: 1;
    background: linear-gradient(180deg, #d9bf8c, #f6e7c4 14%, #fbf1d8 50%, #f2e0b8 86%, #cfb27a);
    box-shadow: 0 10px 24px rgba(0,0,0,0.35), inset 0 0 30px rgba(150,110,50,0.25); }
  .game .field > .listen { border-radius: 50%; pointer-events: none; z-index: 3; border: 5px solid #e2b347;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.7), 0 0 26px rgba(255,205,90,0.9); animation: pulse 1.6s ease-in-out infinite; }
  .game .field > .face { width: var(--s); pointer-events: none; z-index: 2; }
  .game .face img { width: 100%; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.35)); }
  .game .face .name { position: absolute; left: 50%; top: 100%; translate: -50% 2px; white-space: nowrap; font-weight: 700;
    font-size: clamp(0.7rem, calc(var(--s) * 0.14), 1rem); color: #5a3d17; }
  .game .face.shh img { animation: nope 0.5s; }
  .game .face.drowned { transition: opacity 0.6s 0.4s, scale 0.6s 0.4s; opacity: 0; scale: 0.4; }
  .game .face.drowned img { animation: wiggle 0.4s 2; }
  .game .face.drowned::after { content: '✦ ✦ ✦'; position: absolute; left: 50%; top: -20%; translate: -50% 0; color: #e2b347;
    font-size: calc(var(--s) * 0.3); letter-spacing: 0.2em; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }
  .game .face.snuck { transition: opacity 0.6s; opacity: 0.45; }
  .game .face.fade { transition: opacity 0.6s; opacity: 0; }
  .game .field button.gragger { background: none; border: 0; padding: 0; z-index: 4; cursor: pointer; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4)); }
  .game .gragger img { width: 100%; display: block; transform-origin: 60% 80%; }
  .game .gragger.spin img { animation: rattle 0.45s ease-out; }
  .game .gragger.resting { filter: grayscale(0.7) drop-shadow(0 8px 12px rgba(0,0,0,0.4)); opacity: 0.7; }
  .game .gragger.tired img { animation: nope 0.4s; }
  /* Welcome Home */
  .game .field > .kid { transform: translate(-50%, -100%); pointer-events: none; z-index: 2; filter: drop-shadow(0 10px 12px rgba(0,0,0,0.4)); transition: scale 0.2s; }
  .game .kid img { height: var(--kh); width: auto; display: block; }
  .game .kid .mud { position: absolute; width: calc(var(--kh) * 0.16 * var(--sz)); aspect-ratio: 1.25; translate: -50% -50%; pointer-events: none;
    border-radius: 45% 55% 50% 40% / 55% 45% 55% 45%;
    background: radial-gradient(circle at 40% 40%, #75502c, #573a1f 55%, rgba(87,58,31,0.85) 66%, rgba(87,58,31,0) 74%); }
  .game .kid.over { scale: 1.06; }
  .game .kid.hop img { animation: hop 0.6s ease-out; }
  .game .kid.dressed img { animation: dressup 0.6s ease-out; }
  @keyframes dressup { 0% { scale: 0.6; opacity: 0.3; } 70% { scale: 1.08; } 100% { scale: 1; opacity: 1; } }
  .game .field > .suds { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.95); background: rgba(205,232,255,0.4);
    pointer-events: none; z-index: 3; animation: suds 0.9s ease-out forwards; }
  .game .field > .twinkle { color: #ffe08a; font-size: 30px; pointer-events: none; z-index: 5; text-shadow: 0 0 10px rgba(255,220,120,0.9); white-space: nowrap; animation: suds 0.9s ease-out forwards; }
  @keyframes suds { to { translate: 0 -44px; scale: 1.6; opacity: 0; } }
  .game .field button.gift { background: rgba(255,248,230,0.92); border: 3px solid #e2b347; border-radius: 22px; padding: 8px; z-index: 4; cursor: grab;
    touch-action: none; box-shadow: 0 8px 18px rgba(0,0,0,0.35); transition: scale 0.15s; }
  .game .field button.gift[hidden] { display: none; }
  .game .gift img { width: 100%; display: block; pointer-events: none; aspect-ratio: 1; object-fit: contain; }
  .game .gift.want { animation: popup 0.4s ease-out, pulse 1.4s ease-in-out infinite 0.4s; }
  .game .gift.lift { scale: 1.12; z-index: 6; animation: none; }
  .game .gift.landing { transition: left 0.35s, top 0.35s, scale 0.35s, opacity 0.35s; scale: 0.3; opacity: 0.6; animation: none; }
  @keyframes rattle { 15% { rotate: -22deg; } 35% { rotate: 18deg; } 55% { rotate: -14deg; } 75% { rotate: 8deg; } }

  /* Hush the Lions */
  .game .lion { --calm: 0; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.4)); touch-action: none; animation: popup 0.3s ease-out; }
  .game .lion img { width: 100%; transition: opacity 0.6s; }
  .game .lion .sleep { position: absolute; inset: 0; opacity: 0; }
  .game .lion.asleep img:first-child { opacity: 0; }
  .game .lion.asleep .sleep { opacity: 1; }
  .game .lion.roar:not(.asleep) { animation: roar 0.7s ease-out; }
  .game .lion:not(.asleep)::after { content: ''; position: absolute; left: 15%; right: 15%; bottom: -6%; height: 7px; border-radius: 4px;
    background: linear-gradient(90deg, #ffd770 calc(var(--calm) * 100%), rgba(255,255,255,0.25) 0); box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
  @keyframes roar { 25% { scale: 1.12; rotate: -4deg; } 50% { scale: 1.08; rotate: 4deg; } }
  .game .heart { color: #ff8fa8; font-size: 26px; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,0.3); animation: floatup 1s ease-out forwards; }
  .game .zzz { position: absolute; right: 8%; top: -4%; color: #fff3d6; font-family: 'Cormorant Garamond', serif; font-size: clamp(1.2rem, 3vw, 1.8rem);
    letter-spacing: 0.1em; text-shadow: 0 2px 8px rgba(0,0,0,0.6); animation: snooze 2.4s ease-in-out infinite; pointer-events: none; }
  @keyframes floatup { to { translate: 0 -70px; opacity: 0; scale: 1.4; } }
  @keyframes snooze { 50% { translate: 6px -10px; opacity: 0.6; } }

  /* Color the Coat */
  .game .coatbox { filter: drop-shadow(0 12px 18px rgba(0,0,0,0.45)); }
  .game .coatbox.twirl { animation: twirl 1.3s ease-in-out; }
  @keyframes twirl { 50% { rotate: y 180deg; scale: 1.08; } 100% { rotate: y 360deg; } }

  .kingdom .places { position: absolute; z-index: 4; right: max(16px, env(safe-area-inset-right)); top: calc(max(16px, env(safe-area-inset-top)) + 58px);
    width: min(36rem, calc(100vw - 32px)); max-height: calc(100% - 220px); overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;

    background: linear-gradient(0deg, #0b0a12, #15121d); border-top: 1px solid rgba(240,204,138,0.3); }

  /* ---- Family voices: "Read by" on the cover, the grown-up check, and the recorder. */
  .read-by { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 1.6rem; pointer-events: auto; }

  .read-by .chip { font-size: 0.9rem; padding: 0.4em 0.9em; border-radius: 999px; border: 1px solid rgba(240,204,138,0.4); background: var(--glass); color: var(--ink); }

  .gate { position: fixed; inset: 0; z-index: 12; display: grid; place-items: center; padding: 16px; background: rgba(4,5,10,0.7);

  .recorder { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 1rem; overflow-y: auto;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: radial-gradient(ellipse at 50% 0%, #2a2238, var(--night) 70%); opacity: 0; transition: opacity 0.3s; }

    border: 1px solid rgba(240,204,138,0.45); background: var(--glass); color: var(--gold); }

  /* ---- Bedtime: calmer pictures, and a goodnight fade at the end. */

    opacity: 0; transition: opacity 6s ease; }

  /* ---- The Stories page (home): Stories and Games tabs, a bar along the bottom. */
  html.home, html.home body { overflow-y: auto; overflow-x: hidden; height: auto; min-height: 100%; overscroll-behavior: auto; }
  body.home { background: radial-gradient(ellipse at 70% -10%, #2c2440 0%, var(--night) 60%) fixed; }
  body.home #stage, body.home #scrim, body.home #deck, body.home #hint, body.home #dots, body.home #nav { display: none; }
  body:not(.home) .tabbar { display: none; }
  #home { --pad: max(16px, 5vw); max-width: 80rem; margin: 0 auto; padding: max(28px, calc(env(safe-area-inset-top) + 16px)) var(--pad) calc(96px + env(safe-area-inset-bottom)); }
  #home .head h1 { font-size: clamp(2.6rem, 8vw, 4.6rem); line-height: 1; margin: 0.25rem 0 0.4rem; }
  #home .head .sub { margin: 0.2rem 0 0; }

  /* Up next */
  #home .hero { position: relative; display: block; margin: 1.4rem 0 0.4rem; border-radius: 24px; overflow: hidden; text-decoration: none; color: var(--ink);

  #home .hero:hover .hero-art { transform: scale(1.04); }
  #home .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(4,5,10,0.82) 0%, rgba(4,5,10,0.5) 42%, rgba(4,5,10,0) 70%); }
  #home .hero-words { position: absolute; z-index: 1; left: 0; bottom: 0; top: 0; display: flex; flex-direction: column; justify-content: center;
    padding: 24px clamp(18px, 4vw, 44px); max-width: min(30rem, 62%); }
  #home .hero h2 { font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1.02; margin: 0.3rem 0 0.4rem; text-shadow: 0 2px 18px rgba(0,0,0,0.6); }
  #home .hero .sub { margin: 0 0 1.2rem; color: var(--ink); opacity: 0.85; text-shadow: 0 1px 10px rgba(0,0,0,0.7); }
  #home .hero .begin { align-self: flex-start; margin: 0; }

  /* Rows that scroll sideways */
  #home .row { margin-top: 2.2rem; }
  #home .row-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 0.9rem; }
  #home .shelf-title { font-size: clamp(1.6rem, 3.6vw, 2.3rem); color: var(--gold); margin: 0; }
  #home .row-count { color: var(--soft); font-size: 0.8rem; flex: 1; }
  #home .arrow { display: none; align-self: center; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(240,204,138,0.45); background: var(--glass);
    color: var(--gold); place-items: center; padding: 0; }
  #home .arrow svg { width: 18px; height: 18px; }
  #home .arrow:hover { background: rgba(240,204,138,0.14); border-color: var(--gold); }
  @media (hover: hover) and (pointer: fine) { #home .arrow { display: grid; } }
  #home .arrow[hidden] { display: none; }
  #home .track { display: grid; grid-auto-flow: column; grid-auto-columns: clamp(220px, 23%, 300px); gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory;
    margin: 0 calc(-1 * var(--pad)); padding: 6px var(--pad) 16px; scroll-padding: 0 var(--pad); scrollbar-width: none; overscroll-behavior-x: contain; }
  #home .track::-webkit-scrollbar { display: none; }
  #home .track > * { scroll-snap-align: start; }

  #home a.story, #home .game-card { display: block; color: var(--ink); text-decoration: none; text-align: left; font: inherit; padding: 0;
    background: none; border: 0; cursor: pointer; transition: transform 0.25s cubic-bezier(0.2, 1.4, 0.4, 1); }
  #home a.story:hover, #home button.game-card:hover { transform: translateY(-4px) rotate(-0.6deg); }
  #home a.story:active, #home button.game-card:active { transform: scale(0.97); }
  #home .art { position: relative; aspect-ratio: 16 / 10; border-radius: 16px; background-size: cover; background-position: 60% 50%; background-color: #1a1622;
    box-shadow: 0 2px 0 rgba(255,244,214,0.18) inset, 0 14px 30px rgba(0,0,0,0.45); border: 3px solid #fbf6ea; }
  #home .num { position: absolute; left: 10px; top: 10px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(4,5,10,0.65); color: var(--gold); font-weight: 600; font-size: 0.85rem; border: 1px solid rgba(240,204,138,0.5); }
  #home .ribbon { position: absolute; right: 10px; top: 10px; padding: 0.3em 0.75em; border-radius: 999px; background: rgba(240,204,138,0.95); color: #2a1a06;

  #home .stars i.lit { background: var(--gold); filter: drop-shadow(0 0 3px rgba(255,215,112,0.7)); }
  #home .foot .sticker { border-width: 2px; }

  /* Games */
  #home .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 24px 18px; margin-top: 1.6rem; }
  #home .game-card .art { display: grid; place-items: center; }
  #home .game-card .badge:not(.missing) { filter: drop-shadow(0 0 10px rgba(255,215,112,0.9)); }
  #home .game-card .badge.missing { filter: grayscale(0.9) brightness(0.95); opacity: 0.8; box-shadow: 0 0 0 2px rgba(255,244,214,0.5), 0 6px 14px rgba(0,0,0,0.4); }
  #home .game-card .play { position: absolute; right: 10px; bottom: 10px; padding: 0.35em 0.9em; border-radius: 999px; background: rgba(4,5,10,0.6);
    border: 1px solid rgba(240,204,138,0.6); color: var(--gold); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  #home .credit { margin-top: 3.5rem; }

  /* The bar along the bottom */
  .tabbar { position: fixed; z-index: 30; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; gap: 4px; padding: 6px; border-radius: 999px; background: rgba(12,12,22,0.82); border: 1px solid rgba(240,204,138,0.3);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 12px 30px rgba(0,0,0,0.5); }
  .tabbar .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 72px; padding: 8px 12px 6px; border: 0; border-radius: 999px;
    background: none; color: var(--soft); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; transition: background 0.2s, color 0.2s; }
  .tabbar .tab svg { width: 24px; height: 24px; }
  .tabbar .tab:hover { color: var(--ink); }
  .tabbar .tab.on { background: rgba(240,204,138,0.18); color: var(--gold); }
  body.game-open .tabbar, body:has(.kingdom) .tabbar, body:has(.book) .tabbar { display: none; }
  html.native-tabs .tabbar { display: none; }   /* the iPhone/iPad app draws its own (NativeTabs.swift) */

  @media (max-width: 560px) {
    #home .hero { aspect-ratio: auto; min-height: 0; height: 64vw; max-height: 330px; }
    #home .hero::after { background: linear-gradient(0deg, rgba(4,5,10,0.86) 0%, rgba(4,5,10,0.45) 55%, rgba(4,5,10,0) 80%); }
    #home .hero-words { top: auto; max-width: none; padding: 16px 18px; }
    #home .hero .sub { display: none; }
    #home .hero h2 { font-size: 2rem; margin-bottom: 0.7rem; }
    #home .track { grid-auto-columns: 66%; gap: 12px; }
    #home h3 { font-size: 1.3rem; }
    #home .art { border-width: 2px; border-radius: 12px; }
    #home .shelf { grid-template-columns: 1fr 1fr; gap: 18px 12px; }
    #home .shelf h3 { font-size: 1.15rem; }
    .tabbar .tab { min-width: 66px; padding: 8px 8px 6px; }
  }

  /* Words light up as the narrator reads them. */
  .beat span { transition: color 0.25s, text-shadow 0.25s, opacity 0.4s; }
  .beat.reading span { opacity: 0.6; }
  .beat.reading span.said { opacity: 1; }
  .beat.reading span.saying { opacity: 1; color: #fff3d6; text-shadow: 0 0 18px rgba(255,226,160,0.75), 0 1px 18px rgba(0,0,0,0.55); }

  .starts { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 3rem; }
  .starts .begin { margin-top: 0; }
  .begin.read { background: rgba(240,204,138,0.16); }
  /* Quieter buttons beside the main ones: record your own voice, back to all the stories. */
  .soft { display: inline-flex; align-items: center; gap: 0.6em; padding: 0.6em 1.15em 0.6em 0.95em; border-radius: 999px;
    border: 1px solid rgba(245,236,218,0.28); background: var(--glass); color: var(--ink); font-size: 0.92rem; letter-spacing: 0.02em;
    text-decoration: none; pointer-events: auto; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: background 0.2s, border-color 0.2s, color 0.2s; }
  .soft svg { width: 1.15em; height: 1.15em; flex: none; color: var(--gold); }
  .soft:hover { background: rgba(240,204,138,0.12); border-color: rgba(240,204,138,0.7); color: var(--gold); }
  .all-stories { margin-top: 1.4rem; }
  .more { margin-top: 2.2rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem 1.2rem; font-size: 0.95rem; }
  .more span { color: var(--soft); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; }
  .more a { color: var(--gold); font-style: italic; text-decoration: none; border-bottom: 1px solid rgba(240,204,138,0.4); }
  .more a:hover { border-color: var(--gold); }
  .at-cover #dots { opacity: 0; pointer-events: none; }
  .at-cover #next { animation: beckon-btn 2.4s ease-in-out infinite; }
  @keyframes beckon-btn { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

  /* "Tap here" invitation, placed by the stage. */
  #hint { position: fixed; z-index: 3; transform: translate(-50%, -50%); pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 0.9rem;
    opacity: 0; transition: opacity 0.8s ease; }
  #hint.on { opacity: 1; }
  #hint .dot { width: 18px; height: 18px; border-radius: 50%; background: #fff3d6;
    box-shadow: 0 0 18px 6px rgba(255,236,190,0.7), 0 0 60px 20px rgba(255,226,160,0.35);
    animation: beckon 2.2s ease-in-out infinite; }
  #hint .label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--gold); text-shadow: 0 1px 12px rgba(0,0,0,0.8); white-space: nowrap; }
  @keyframes beckon { 0%, 100% { transform: scale(0.8); opacity: 0.7; } 50% { transform: scale(1.25); opacity: 1; } }

  /* Phones: words sit low over a darker band, art fills the top. */
  @media (max-width: 760px) {
    #scrim { background: linear-gradient(0deg, rgba(4,5,10,0.9) 0%, rgba(4,5,10,0.6) 42%, rgba(4,5,10,0) 70%); }
    /* The cover and the end page carry more words, up higher: darken the picture behind them too. */
    #scrim::after { content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity 0.9s ease;
      background: linear-gradient(0deg, rgba(4,5,10,0.35) 0%, rgba(4,5,10,0.55) 55%, rgba(4,5,10,0.35) 100%); }
    body.at-cover #scrim::after, body.at-end #scrim::after { opacity: 1; }
    .slide { align-items: flex-end; padding-bottom: calc(16vh + env(safe-area-inset-bottom)); padding-right: 44px; }
    .slide.cover, .slide.title { padding-bottom: calc(22vh + env(safe-area-inset-bottom)); }
    #nav { gap: 6px; }
    #nav button, #nav .navlink { width: 38px; height: 38px; }
    #nav svg { width: 16px; height: 16px; }
    #nav .gap { width: 2px; }
  }

  /* Short screens (a phone on its side): everything on a page has to fit between the top of the
     screen and the buttons along the bottom. */
  @media (max-height: 500px) {
    #scrim { background: linear-gradient(90deg, rgba(4,5,10,0.88) 0%, rgba(4,5,10,0.7) 38%, rgba(4,5,10,0.2) 66%, rgba(4,5,10,0) 80%); }
    .slide, .slide.cover, .slide.title { align-items: center;
      padding-top: max(10px, env(safe-area-inset-top)); padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
    .cover h1 { font-size: 2.5rem; margin: 0.35rem 0 0.4rem; }
    .title h2 { font-size: 2.6rem; }
    .sub { font-size: 0.95rem; }
    .starts { margin-top: 0.9rem; gap: 10px; }
    .read-by { margin-top: 0.7rem; }
    .slide .all-stories, .slide .credit { display: none; }     /* the bar's own button goes to all stories */
    .end h2 { font-size: 2rem; margin: 0.3rem 0 0.4rem; }
    .mini { margin-bottom: 0.6rem; }
    .beat { font-size: 1.25rem; line-height: 1.45; }
    .source { margin-top: 0.9rem; }
    .play-game { margin-top: 0.9rem; }
    /* Talk about it: the questions on the left, the memory verse beside them. */
    .slide.talk .col { background: rgba(4,5,10,0.62); border-radius: 20px; padding: 14px 16px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      max-width: min(46rem, 100%); display: grid; grid-template-columns: 1.2fr 0.8fr; column-gap: 22px; align-items: center; }
    .slide.talk .col > .eyebrow, .slide.talk .col > h2, .slide.talk .questions { grid-column: 1; }
    .slide.talk .memory { grid-column: 2; grid-row: 1 / span 3; padding: 12px 14px; }
    .talk h2 { font-size: 1.7rem; margin: 0.2rem 0 0.5rem; }
    .talk .questions { gap: 0.35rem; margin: 0; }
    .talk .questions li { font-size: 0.95rem; line-height: 1.35; }
    .talk .memory blockquote { font-size: 1.15rem; }

  }
  @media (max-height: 420px) {

  }

  @media (prefers-reduced-motion: reduce) {
    .slide, .slide.on { transition: none; transform: none; filter: none; }
    #hint .dot, .at-cover #next { animation: none; }
  }
  /* ---- Cream: the menus (Stories, Games, the sticker book, the Kingdom's tray, the grown-up
     cards and the recorder) sit on warm paper, like the cut-paper pictures themselves. The story
     pages and the games stay as they are: the paintings fill the screen there. Anything drawn on
     top of a painting (the big Start here card, the story covers' badges) keeps its light text. */
  body.home, .book, .gate .card, .recorder, .kingdom .tray {
    --ink: #3b2a1a; --soft: rgba(59, 42, 26, 0.68); --gold: #a8652a; --glass: rgba(255, 251, 242, 0.9);
    --edge: rgba(168, 101, 42, 0.32); --paper-shadow: rgba(90, 60, 25, 0.22);
    color: var(--ink); text-shadow: none;
  }
  /* Games, the Kingdom's meadow and the little pop-ups play over paintings, even when opened from the menus. */
  .game, .kingdom, .toast { --ink: #f5ecda; --soft: rgba(245, 236, 218, 0.62); --gold: #f0cc8a; --glass: rgba(4, 5, 10, 0.38); color: var(--ink); }
  #home .hero, #home .art { --ink: #f5ecda; --soft: rgba(245, 236, 218, 0.62); --gold: #f0cc8a; --glass: rgba(4, 5, 10, 0.38); }
  html.home, body.home { background: radial-gradient(ellipse at 70% -10%, #fffaf0 0%, #f8f0e1 45%, #f1e4cb 100%) fixed; }
  #home .head h1, #home h3 { color: var(--ink); }
  #home .art { border-color: #fffdf8; box-shadow: 0 10px 22px var(--paper-shadow); }
  #home .hero { border-color: #fffdf8; box-shadow: 0 16px 34px rgba(90, 60, 25, 0.28); }
  #home .stars i { background: rgba(59, 42, 26, 0.18); }
  #home .stars i.lit { background: #e3a531; }
  #home .arrow { border-color: var(--edge); color: var(--gold); }
  #home .arrow:hover { background: rgba(168, 101, 42, 0.1); }
  .tabbar { background: rgba(255, 251, 242, 0.94); border-color: var(--edge, rgba(168, 101, 42, 0.32)); box-shadow: 0 10px 30px rgba(90, 60, 25, 0.25); }
  .tabbar .tab { color: rgba(59, 42, 26, 0.6); }
  .tabbar .tab:hover { color: #3b2a1a; }
  .tabbar .tab.on { background: rgba(227, 165, 49, 0.22); color: #a8652a; }
  :is(.book, .recorder, .kingdom .tray, .gate .card) .begin { border-color: var(--edge); }
  :is(.book, .recorder, .kingdom .tray, .gate .card) .begin:hover { background: rgba(168, 101, 42, 0.1); border-color: var(--gold); }

  /* The sticker book: a sheet of paper over the page. */
  .book { background: rgba(248, 240, 225, 0.94); }
  .book .close { border-color: var(--edge); }
  .book .blank { border-color: rgba(168, 101, 42, 0.35); color: rgba(168, 101, 42, 0.5); background: rgba(255, 255, 255, 0.35); }
  .book .sticker, #home .sticker { box-shadow: 0 6px 16px var(--paper-shadow), 0 1px 2px rgba(90, 60, 25, 0.3); }
  .book .sticker.missing, .book .badge.missing { filter: grayscale(1) brightness(0.92) opacity(0.6); }
  .book .sticker.lamb.missing { filter: grayscale(1) brightness(0.75) opacity(0.5); box-shadow: none; }

  /* The Kingdom's tray along the bottom of the meadow. */
  .kingdom .top { background: linear-gradient(180deg, rgba(4,5,10,0.62), rgba(4,5,10,0.25) 70%, rgba(4,5,10,0)); padding-bottom: 28px; }
  .kingdom .tray { background: linear-gradient(0deg, #f1e4cb, #f8f0e1); border-top-color: var(--edge); scrollbar-color: rgba(168, 101, 42, 0.35) transparent; }
  .kingdom .slot { border-color: var(--edge); background: rgba(255, 255, 255, 0.55); }

  /* Ask a grown-up, and Who's reading? */
  .gate { background: rgba(59, 42, 26, 0.35); }

  .recorder { background: radial-gradient(ellipse at 50% 0%, #fffaf0, #f8f0e1 55%, #f1e4cb); }
  .recorder .close, .recorder .step { border-color: var(--edge); }

  /* ---- Home, Library and Me (home.js). */
  #home .hero.feature { height: clamp(210px, 26vw, 320px); margin-top: 1.4rem; }
  #home button.hero { width: 100%; padding: 0; font: inherit; text-align: left; cursor: pointer; }
  #home .kingdom-card { margin-top: 2rem; }
  #home .kingdom-card .counts { margin: -0.1rem 0 1rem; color: var(--ink); opacity: 0.9; font-size: 0.9rem; text-shadow: 0 1px 10px rgba(0,0,0,0.7); }
  /* Library: Stories | Games */
  #home .seg { display: inline-flex; gap: 2px; margin-top: 1.1rem; padding: 4px; border-radius: 999px;
    background: rgba(168, 101, 42, 0.1); border: 1px solid var(--edge); }
  #home .seg button { border: 0; background: none; font: inherit; font-weight: 600; font-size: 0.92rem; padding: 0.55em 1.5em; border-radius: 999px;
    color: var(--soft); cursor: pointer; transition: background 0.2s, color 0.2s, box-shadow 0.2s; }
  #home .seg button[aria-selected="true"] { background: #fffdf8; color: var(--gold); box-shadow: 0 2px 8px var(--paper-shadow); }
  #home .seg + .row { margin-top: 1.4rem; }
  /* Me: the numbers */
  #home .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 1.3rem; }
  #home .stat { background: #fffdf8; border: 1px solid var(--edge); border-radius: 18px; padding: 14px 14px 12px; box-shadow: 0 6px 16px var(--paper-shadow); }
  #home .stat b { display: block; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1; color: var(--ink); }
  #home .stat b small { font-family: 'Literata', serif; font-weight: 400; font-size: 0.8rem; color: var(--soft); }
