<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingdom Bible</title>
<meta name="description" content="Bible stories for kids and beginners, told in cut-paper pictures you can touch, with narration and music.">
<meta name="theme-color" content="#04050a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kingdom Bible">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --ink: #f5ecda;
    --soft: rgba(245, 236, 218, 0.62);
    --gold: #f0cc8a;
    --night: #04050a;
    --glass: rgba(4, 5, 10, 0.38);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  html { background: var(--night); }
  body { margin: 0; color: var(--ink); background: var(--night); font-family: 'Literata', Georgia, serif;
    -webkit-font-smoothing: antialiased; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #stage { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  #scrim { position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: linear-gradient(90deg, rgba(4,5,10,0.8) 0%, rgba(4,5,10,0.6) 32%, rgba(4,5,10,0.12) 60%, rgba(4,5,10,0) 75%); }

  /* ---- Slides: only the current one is shown; the rest wait above or below it. */
  #deck { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .slide { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 max(16px, 7vw, env(safe-area-inset-left));
    opacity: 0; filter: blur(5px); visibility: hidden;
    transition: opacity 0.7s ease, transform 1s cubic-bezier(0.2, 0.7, 0.2, 1), filter 0.7s ease, visibility 0s linear 1s; }
  .slide.below { transform: translateY(36px); }
  .slide.above { transform: translateY(-36px); }
  .slide.on { opacity: 1; filter: none; transform: none; visibility: visible;
    transition-delay: 0.3s, 0.3s, 0.3s, 0s; transition-duration: 1.1s, 1.3s, 1.1s, 0s; }
  .col { max-width: 34rem; text-shadow: 0 1px 18px rgba(0,0,0,0.55); }
  .slide.on .col { pointer-events: auto; }

  .kicker, .eyebrow { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); }
  h1, h2 { font-family: 'Cormorant Garamond', serif; font-weight: 500; letter-spacing: 0.005em; margin: 0; }
  .cover h1 { font-size: clamp(3.2rem, 9vw, 6.4rem); line-height: 0.95; margin: 0.9rem 0 1.1rem; }
  .sub { font-style: italic; color: var(--soft); font-size: 1.1rem; }
  .title h2 { font-size: clamp(2.8rem, 7vw, 5.2rem); line-height: 1; margin-top: 0.8rem; }
  .end h2 { font-size: clamp(2.3rem, 5vw, 3.5rem); font-style: italic; margin: 0.6rem 0 1rem; }
  .credit { color: var(--soft); font-size: 0.85rem; margin-top: 2.5rem; }

  .mini { margin-bottom: 1.6rem; opacity: 0.85; }
  .beat { font-size: clamp(1.45rem, 2.3vw, 2rem); line-height: 1.5; margin: 0; max-width: 30rem; }

  .begin { margin-top: 3rem; }
  button { font: inherit; color: var(--ink); cursor: pointer; }
  .begin, .source summary { display: inline-flex; align-items: center; gap: 0.55em;
    color: var(--gold); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
    padding: 0.7em 1.3em; border: 1px solid rgba(240,204,138,0.45); border-radius: 999px; background: var(--glass);
    transition: background 0.2s, border-color 0.2s; }
  .begin:hover, .source summary:hover { background: rgba(240,204,138,0.12); border-color: var(--gold); }
  a.begin { text-decoration: none; }
  button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .source { margin-top: 2.2rem; font-size: 0.95rem; }
  .source summary { cursor: pointer; list-style: none; padding: 0.55em 1.1em; letter-spacing: 0.14em; }
  .source summary::-webkit-details-marker { display: none; }
  .source summary::before { content: '+'; font-size: 1.15em; font-weight: 400; line-height: 1; }
  .source[open] summary::before { content: '–'; }
  .verses { margin-top: 1.2rem; padding: 0 0.6rem 0 1.1rem; border-left: 1px solid rgba(240,204,138,0.35);
    max-height: 36vh; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(240,204,138,0.4) transparent; }
  .verses p { color: var(--soft); line-height: 1.7; margin: 0 0 0.9em; }
  .verses sup { font-size: 0.7em; font-weight: 600; color: var(--gold); margin-right: 0.35em; }

  /* ---- Getting around: day dots on the right, back/next at the bottom right. */
  #dots { position: fixed; z-index: 3; right: max(14px, 2.2vw, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 14px; transition: opacity 0.8s; }
  #dots button { width: 9px; height: 9px; padding: 0; border-radius: 99px; border: 1px solid rgba(240,204,138,0.65);
    background: transparent; transition: height 0.5s cubic-bezier(0.2, 0.7, 0.2, 1), background 0.4s; }
  #dots button.on { height: 30px; background: var(--gold); }
  #nav { position: fixed; z-index: 3; right: max(14px, 2.2vw, env(safe-area-inset-right)); bottom: max(16px, 3vh, calc(env(safe-area-inset-bottom) + 8px));
    display: flex; gap: 10px; }
  #nav button, #nav .navlink { width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(240,204,138,0.45);
    background: var(--glass); color: var(--gold); display: grid; place-items: center;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: opacity 0.4s, background 0.2s; }
  #nav button:hover:not(:disabled) { background: rgba(240,204,138,0.14); }
  #nav button:disabled { opacity: 0.25; cursor: default; }
  #nav svg { width: 18px; height: 18px; }
  #nav .gap { width: 6px; }
  #nav .toggle[aria-pressed="true"] { background: rgba(240,204,138,0.2); border-color: var(--gold); }
  #sound[aria-pressed="true"] .off, #sound[aria-pressed="false"] .on { display: none; }

  /* ---- Stickers: round cut-outs of the paintings with a white paper edge. */
  .sticker { flex: none; border-radius: 50%; background-repeat: no-repeat; background-color: #2a2330;
    border: 4px solid #fbf6ea; box-shadow: 0 6px 18px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.4); transform: rotate(-4deg); }
  .sticker.lamb { background-color: #f6efdc; background-size: 74%; background-position: 50% 58%; }
  .sticker.lamb.missing { filter: grayscale(1) brightness(0.35); opacity: 0.45; box-shadow: none; }
  .book .lambs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -0.3rem 0 1.4rem; }
  .book .lambs span { color: var(--soft); font-size: 0.85rem; margin-right: 0.4rem; }
  .book .lambs .sticker { border-width: 2px; transform: none; }
  #stickers { position: relative; }
  #stickers .count { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--gold); color: var(--night); font-size: 0.68rem; font-weight: 600; line-height: 18px; text-align: center; }
  #stickers .count:empty { display: none; }
  #stickers.bump { animation: bump 0.5s ease; }
  @keyframes bump { 40% { transform: scale(1.22); } }
  .toast { position: fixed; z-index: 8; left: 50%; top: max(9vh, calc(env(safe-area-inset-top) + 16px)); display: flex; align-items: center; gap: 18px;
    padding: 14px 26px 14px 14px; border-radius: 999px; background: rgba(4,5,10,0.72); border: 1px solid rgba(240,204,138,0.45);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); pointer-events: none;
    transform: translate(-50%, -20px) scale(0.9); opacity: 0; transition: transform 0.45s cubic-bezier(0.2, 1.4, 0.3, 1), opacity 0.3s; }
  .toast.in { transform: translate(-50%, 0) scale(1); opacity: 1; }
  .toast .sticker { transition: transform 0.7s cubic-bezier(0.5, 0, 0.7, 0.4); animation: pop 0.6s cubic-bezier(0.2, 1.6, 0.4, 1); }
  .toast.out { background: transparent; border-color: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .toast.out .words { opacity: 0; }
  .toast .words { transition: opacity 0.3s; }
  .toast .name { font-family: 'Cormorant Garamond', serif; font-size: 1.7rem; line-height: 1.1; }
  @keyframes pop { 0% { transform: scale(0.2) rotate(-30deg); } 100% { transform: scale(1) rotate(-4deg); } }
  @media (max-width: 560px) {
    .toast { gap: 12px; padding: 10px 20px 10px 10px; max-width: calc(100vw - 24px); }
    .toast .sticker { border-width: 3px; }
    .toast .name { font-size: 1.3rem; }
  }

  .book { position: fixed; inset: 0; z-index: 9; overflow-y: auto; overscroll-behavior: contain; background: rgba(4,5,10,0.78);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; transition: opacity 0.3s;
    padding: max(48px, calc(env(safe-area-inset-top) + 24px)) max(16px, 5vw) max(48px, calc(env(safe-area-inset-bottom) + 24px)); }
  .book.in { opacity: 1; }
  .book .page { max-width: 62rem; margin: 0 auto; position: relative; }
  .book h2 { font-size: clamp(2.4rem, 6vw, 3.6rem); margin: 0.3rem 0 1.6rem; }
  .book h3 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 1.8rem; margin: 2rem 0 1rem; color: var(--gold); }
  .book h3 span { color: var(--soft); font-family: 'Literata', serif; font-size: 0.9rem; }
  .book .close { position: absolute; top: 0; right: 0; width: 46px; height: 46px; border-radius: 50%; font-size: 1.6rem; line-height: 1;
    border: 1px solid rgba(240,204,138,0.45); background: var(--glass); color: var(--gold); }
  .book .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 22px 14px; }
  .book figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .book figure:nth-child(even) .sticker { transform: rotate(5deg); }
  .book figcaption { font-size: 0.85rem; line-height: 1.35; }
  .book .missing figcaption { color: var(--soft); font-style: italic; font-size: 0.78rem; }
  .book .blank { width: 104px; height: 104px; border-radius: 50%; border: 2px dashed rgba(240,204,138,0.4); display: grid; place-items: center;
    color: rgba(240,204,138,0.55); font-family: 'Cormorant Garamond', serif; font-size: 2.4rem; }

  /* ---- Games: open over the story, full screen. */
  .game { position: fixed; inset: 0; z-index: 9; background-size: cover; background-color: var(--night); opacity: 0; transition: opacity 0.35s;
    display: flex; flex-direction: column; overflow: hidden;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .game.in { opacity: 1; }
  .game::before { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(4,5,10,0.55) 0%, rgba(4,5,10,0) 30%, rgba(4,5,10,0) 45%, rgba(4,5,10,0.55) 100%); }
  .game > * { position: relative; }
  .game .top { display: flex; align-items: center; gap: 14px; }
  .game .title { flex: 1; text-shadow: 0 1px 14px rgba(0,0,0,0.6); }
  .game h2 { font-size: clamp(1.8rem, 5vw, 2.8rem); }
  .game .progress { color: var(--gold); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 0.5em 1em; border-radius: 999px; background: var(--glass); border: 1px solid rgba(240,204,138,0.4); white-space: nowrap; }
  .game .close { width: 46px; height: 46px; border-radius: 50%; font-size: 1.6rem; line-height: 1; flex: none;
    border: 1px solid rgba(240,204,138,0.45); background: var(--glass); color: var(--gold); }
  .game .say { margin: 0.6rem 0 0; max-width: 34rem; font-size: clamp(1.05rem, 2.2vw, 1.3rem); line-height: 1.45; text-shadow: 0 1px 14px rgba(0,0,0,0.7); }
  .game .tray { margin-top: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(8px, 2vw, 18px); padding-bottom: 6px; }
  .game .piece { width: clamp(72px, min(12vw, 15vh), 118px); aspect-ratio: 1; border-radius: 22px; border: 3px solid #fbf6ea; background: rgba(251,246,234,0.88);
    box-shadow: 0 8px 20px rgba(0,0,0,0.35); padding: 8px; display: grid; place-items: center; cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.2, 1.4, 0.4, 1), box-shadow 0.25s, opacity 0.6s; }
  .game .piece img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .game .piece:hover { transform: translateY(-3px); }
  .game .piece.picked { transform: translateY(-10px) scale(1.08); box-shadow: 0 0 0 4px var(--gold), 0 14px 26px rgba(0,0,0,0.4); }
  .game .piece.nope { animation: nope 0.4s ease; }
  .game .piece.gone { transform: translate(var(--dx), var(--dy)) scale(0.12); opacity: 0; pointer-events: none;
    transition: transform 0.7s cubic-bezier(0.5, -0.3, 0.6, 1), opacity 0.7s ease-in; }
  @keyframes nope { 20%, 60% { transform: translateX(-8px) rotate(-4deg); } 40%, 80% { transform: translateX(8px) rotate(4deg); } }
  .game .won { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.8); opacity: 0; text-align: center;
    width: min(26rem, calc(100% - 32px)); padding: 28px 24px; border-radius: 28px; background: rgba(4,5,10,0.82);
    border: 1px solid rgba(240,204,138,0.5); transition: transform 0.45s cubic-bezier(0.2, 1.5, 0.4, 1), opacity 0.3s; }
  .game .won.in { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .game .won .sticker { margin: 0 auto 14px; }
  .game .won h3 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 2.6rem; margin: 0.2rem 0; }
  .game .won p { color: var(--soft); line-height: 1.5; }
  .game .won .starts { justify-content: center; margin-top: 1.4rem; }
  .game .item { position: absolute; transform: translate(-50%, -50%) scale(var(--size, 1)); border: 0; padding: 0; background: none; cursor: pointer; }
  .game .item.star { width: 46px; height: 46px; background: #c9cfe6; opacity: 0.55; filter: drop-shadow(0 0 4px rgba(255,255,255,0.4));
    clip-path: polygon(50% 0, 61% 38%, 100% 50%, 61% 62%, 50% 100%, 39% 62%, 0 50%, 39% 38%); animation: twinkle 2.6s ease-in-out infinite var(--delay); }
  .game .item.star.got { background: #fff1b8; opacity: 1; filter: drop-shadow(0 0 14px #ffd770) drop-shadow(0 0 30px rgba(255,215,112,0.7)); animation: shine 0.5s ease-out; }
  @keyframes twinkle { 50% { opacity: 0.3; } }
  @keyframes shine { 0% { transform: translate(-50%, -50%) scale(0.6); } 60% { transform: translate(-50%, -50%) scale(1.6); } }
  .game .item.bubble { width: 54px; height: 54px; border-radius: 50%; border: 2px solid rgba(225,245,255,0.85);
    background: radial-gradient(circle at 32% 30%, rgba(255,255,255,0.9) 0 12%, rgba(200,235,255,0.15) 13%); animation: bob 5s ease-in-out infinite var(--delay); }
  .game .item.bubble.got { animation: burst 0.35s ease-out forwards; }
  @keyframes bob { 50% { margin-top: -26px; margin-left: 10px; } }
  @keyframes burst { to { transform: translate(-50%, -50%) scale(1.8); opacity: 0; } }
  .game .item.lamb { width: 64px; opacity: 0.92; animation: peek 3.4s ease-in-out infinite var(--delay); }
  .game .item.lamb img { width: 100%; display: block; pointer-events: none; }
  .game .item.lamb.got { opacity: 1; animation: hop 0.6s ease-out; filter: drop-shadow(0 0 14px #ffe7a0); }
  @keyframes peek { 50% { margin-top: 4px; } }
  @keyframes hop { 40% { margin-top: -30px; } }
  .game .tally { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); font-family: 'Cormorant Garamond', serif; font-size: clamp(4rem, 14vw, 7rem);
    color: #fff3d6; text-shadow: 0 0 30px rgba(255,215,112,0.8), 0 2px 12px rgba(0,0,0,0.6); pointer-events: none; }
  .game .tally.pop { animation: tally 0.45s cubic-bezier(0.2, 1.6, 0.4, 1); }
  @keyframes tally { 0% { transform: translateX(-50%) scale(0.4); } 100% { transform: translateX(-50%) scale(1); } }
  .sticker.badge.emoji { display: grid; place-items: center; background: #f3d38d; line-height: 1; }
  .sticker.badge { background-color: #f3d38d; background-size: 70%; background-position: 50% 55%; border-color: #fff4d6;
    box-shadow: 0 0 0 3px #d9a646, 0 8px 20px rgba(0,0,0,0.4); }
  .sticker.badge.missing { filter: grayscale(1) brightness(0.4); opacity: 0.5; box-shadow: none; }
  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti i { position: absolute; top: 60%; width: 10px; height: 14px; border-radius: 2px; animation: confetti var(--d) cubic-bezier(0.2, 0.6, 0.4, 1) forwards; }
  @keyframes confetti { 0% { transform: translate(0, 0) rotate(0); opacity: 1; }
    45% { transform: translate(calc(var(--x) * 0.6), var(--y)) rotate(calc(var(--r) * 0.5)); opacity: 1; }
    100% { transform: translate(var(--x), 70vh) rotate(var(--r)); opacity: 0; } }
  .play-game { margin-top: 1.6rem; }
  .book .games { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: -0.6rem 0 1.4rem; }
  .book .games span { color: var(--soft); font-size: 0.85rem; }

  /* ---- Your Kingdom: a meadow to decorate with what you've collected. */
  .kingdom { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; background: var(--night); opacity: 0; transition: opacity 0.35s; }
  .kingdom.in { opacity: 1; }
  .kingdom .meadow { position: relative; flex: 1; background-size: cover; background-position: 60% 60%; overflow: hidden; touch-action: none; }
  .kingdom .top { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; gap: 14px; pointer-events: none;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
    background: linear-gradient(180deg, rgba(4,5,10,0.5), rgba(4,5,10,0)); }
  .kingdom .title { flex: 1; text-shadow: 0 1px 14px rgba(0,0,0,0.6); }
  .kingdom h2 { font-size: clamp(1.8rem, 5vw, 2.8rem); }
  .kingdom .close { pointer-events: auto; width: 46px; height: 46px; border-radius: 50%; font-size: 1.6rem; line-height: 1; flex: none;
    border: 1px solid rgba(240,204,138,0.45); background: var(--glass); color: var(--gold); }
  .kingdom .placed { position: absolute; cursor: grab; touch-action: none; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35)); transition: filter 0.2s; }
  .kingdom .placed .sticker { box-shadow: none; }
  .kingdom .placed.lifted { cursor: grabbing; filter: drop-shadow(0 16px 18px rgba(0,0,0,0.45)); z-index: 2; }
  .kingdom .placed.selected { outline: 2px dashed var(--gold); outline-offset: 6px; border-radius: 12px; }
  .kingdom .cutout { display: block; height: auto; pointer-events: none; }
  .kingdom .tools { position: absolute; z-index: 3; transform: translate(-50%, 0); display: none; gap: 8px; padding: 6px; border-radius: 999px;
    background: rgba(4,5,10,0.78); border: 1px solid rgba(240,204,138,0.45); }
  .kingdom .tools.on { display: flex; }
  .kingdom .tools button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(240,204,138,0.35); background: transparent; color: var(--gold); font-size: 1.15rem; }
  .kingdom .tray { display: flex; gap: 10px; overflow-x: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(240,204,138,0.4) transparent;
    padding: 12px max(16px, env(safe-area-inset-left)) max(14px, calc(env(safe-area-inset-bottom) + 8px));
    background: linear-gradient(0deg, #0b0a12, #15121d); border-top: 1px solid rgba(240,204,138,0.3); }
  .kingdom .slot { flex: none; width: 76px; height: 76px; border-radius: 16px; display: grid; place-items: center; padding: 6px; cursor: grab; touch-action: none;
    border: 1px solid rgba(240,204,138,0.3); background: rgba(251,246,234,0.06); }
  .kingdom .slot .cutout { height: auto !important; max-width: 64px; max-height: 62px; object-fit: contain; }
  .kingdom .slot.locked { cursor: help; border-style: dashed; }
  .kingdom .slot.locked .cutout { filter: brightness(0) invert(0.85) sepia(0.4); opacity: 0.25; }
  .kingdom .hint { position: absolute; left: 50%; bottom: 110px; transform: translate(-50%, 10px); margin: 0; padding: 0.6em 1.1em; border-radius: 999px;
    background: rgba(4,5,10,0.85); border: 1px solid rgba(240,204,138,0.45); color: var(--ink); font-size: 0.9rem; white-space: nowrap; max-width: calc(100% - 32px);
    overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; }
  .kingdom .hint.on { opacity: 1; transform: translate(-50%, 0); }
  .toast .piece-art { display: grid; place-items: center; border-radius: 50%; background: #f6efdc; border: 4px solid #fbf6ea; box-shadow: 0 6px 18px rgba(0,0,0,0.45); }
  .toast .piece-art img { max-width: 78%; max-height: 82%; }
  .kingdom .slot .sticker { transform: none; border-width: 2px; }

  /* ---- Family voices: "Read by" on the cover, the grown-up check, and the recorder. */
  .read-by { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 1.6rem; pointer-events: auto; }
  .read-by .welcome { flex-basis: 100%; margin: 0 0 0.4rem; color: var(--gold); font-size: 1.05rem; }
  .read-by .label { color: var(--soft); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; margin-right: 4px; }
  .read-by .chip { font-size: 0.9rem; padding: 0.4em 0.9em; border-radius: 999px; border: 1px solid rgba(240,204,138,0.4); background: var(--glass); color: var(--ink); }

  .gate { position: fixed; inset: 0; z-index: 12; display: grid; place-items: center; padding: 16px; background: rgba(4,5,10,0.7);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; transition: opacity 0.25s; }
  .gate.in { opacity: 1; }
  .gate .card { width: min(26rem, 100%); padding: 26px 22px; border-radius: 24px; background: #12101a; border: 1px solid rgba(240,204,138,0.45); text-align: center; }
  .gate h3 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 2rem; margin: 0.3rem 0 1rem; }
  .gate p { color: var(--soft); line-height: 1.5; margin: 0.4rem 0; }
  .gate .answers { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 0.6rem 0; }
  .gate .answers .begin { margin: 0; min-width: 5rem; font-size: 0.95rem; }
  .gate .typed { display: flex; gap: 8px; margin: 0.8rem 0 0.4rem; }
  .gate .name { flex: 1; min-width: 0; font: inherit; padding: 0.6em 0.9em; border-radius: 999px; border: 1px solid rgba(240,204,138,0.4); background: rgba(255,255,255,0.06); color: var(--ink); }
  .gate .typed .begin { margin: 0; }
  .gate .cancel { margin-top: 0.8rem; background: none; border: 0; color: var(--soft); text-decoration: underline; }
  .recorder { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 1rem; overflow-y: auto;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: radial-gradient(ellipse at 50% 0%, #2a2238, var(--night) 70%); opacity: 0; transition: opacity 0.3s; }
  .recorder.in { opacity: 1; }
  .recorder .top { align-self: stretch; display: flex; align-items: flex-start; gap: 14px; }
  .recorder .title { flex: 1; }
  .recorder h2 { font-size: clamp(1.6rem, 4.5vw, 2.4rem); }
  .recorder .close { width: 46px; height: 46px; border-radius: 50%; font-size: 1.6rem; line-height: 1; flex: none;
    border: 1px solid rgba(240,204,138,0.45); background: var(--glass); color: var(--gold); }
  .recorder .where { color: var(--gold); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; margin-top: 2vh; text-align: center; }
  .recorder .prompt { max-width: 38rem; font-size: clamp(1.5rem, 4.2vw, 2.3rem); line-height: 1.45; text-align: center; margin: 0; flex: 1;

  .recorder .level { width: 14px; height: 14px; border-radius: 50%; background: var(--gold); opacity: 0.35;
    transform: scale(calc(1 + var(--level, 0) * 4)); transition: transform 0.08s; }

  .recorder .controls { display: flex; align-items: center; gap: 14px; }
  .recorder .step { width: 50px; height: 50px; border-radius: 50%; font-size: 1.6rem; border: 1px solid rgba(240,204,138,0.45); background: var(--glass); color: var(--gold); }

  .recorder .rec.on { border-radius: 24px; background: #b3262b; animation: recpulse 1.2s ease-in-out infinite; }
  @keyframes recpulse { 50% { box-shadow: 0 0 0 12px rgba(229,72,77,0.15), 0 8px 24px rgba(229,72,77,0.4); } }
  .recorder .dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 34rem; }
  .recorder .dots button { width: 12px; height: 12px; padding: 0; border-radius: 50%; border: 1px solid rgba(240,204,138,0.6); background: transparent; }
  .recorder .dots button.done { background: var(--gold); }
  .recorder .dots button.on { outline: 2px solid #fbf6ea; outline-offset: 2px; }
  .recorder .finish { margin-top: 0.4rem; }
  .recorder .summary { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.92); opacity: 0; width: min(28rem, calc(100% - 32px));

  /* ---- "Talk about it": questions for the family and a memory verse. */
  .talk h2 { font-size: clamp(2.2rem, 5vw, 3.4rem); margin: 0.4rem 0 1rem; }
  .talk .questions { margin: 0 0 1.4rem; padding-left: 1.4em; display: grid; gap: 0.7rem; }

  .talk .questions li::marker { color: var(--gold); font-family: 'Cormorant Garamond', serif; font-weight: 600; }
  .talk .memory { margin: 0; padding: 16px 20px 14px; border-radius: 18px; background: rgba(240,204,138,0.08); border: 1px solid rgba(240,204,138,0.45); max-width: 32rem; }
  .talk .memory blockquote { margin: 0.4rem 0; font-family: 'Cormorant Garamond', serif; font-size: clamp(1.4rem, 2.6vw, 1.9rem); line-height: 1.3; font-style: italic; }

  @media (max-width: 760px) {

    .talk .questions li { font-size: 1rem; }

  }

  /* ---- Bedtime: calmer pictures, and a goodnight fade at the end. */
  #stage { transition: filter 1.5s ease; }
  body.bedtime #stage { filter: brightness(0.7) saturate(0.8) sepia(0.18); }
  body.bedtime .beat, body.bedtime h1, body.bedtime h2 { color: #e9dcc2; }
  body.bedtime #nav button:not(#bedtime), body.bedtime #nav .navlink { opacity: 0.6; }
  body::after { content: 'Goodnight'; position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; pointer-events: none;
    background: #020205; color: rgba(240,204,138,0.85); font-family: 'Cormorant Garamond', serif; font-size: clamp(3rem, 10vw, 6rem); font-style: italic;
    opacity: 0; transition: opacity 6s ease; }
  body.goodnight::after { opacity: 1; pointer-events: auto; }

  /* ---- The Stories page (home). */
  html.home, html.home body { overflow-y: auto; overflow-x: hidden; height: auto; min-height: 100%; overscroll-behavior: auto; }
  body.home { background: radial-gradient(ellipse at 70% -10%, #2c2440 0%, var(--night) 60%) fixed; }
  body.home #stage, body.home #scrim, body.home #deck, body.home #hint, body.home #dots, body.home #nav { display: none; }
  #home { max-width: 76rem; margin: 0 auto; padding: max(40px, calc(env(safe-area-inset-top) + 24px)) max(16px, 5vw) max(48px, calc(env(safe-area-inset-bottom) + 32px)); }
  #home .head h1 { font-size: clamp(3rem, 9vw, 5.6rem); line-height: 1; margin: 0.3rem 0 0.6rem; }
  #home .head .sub { margin: 0 0 1.4rem; }
  #home .shelf-title { font-size: clamp(1.8rem, 4vw, 2.6rem); color: var(--gold); margin: 3rem 0 1.2rem; }
  #home .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 26px 20px; }
  #home a.story, #home .game-card { display: block; color: var(--ink); text-decoration: none; text-align: left; font: inherit; padding: 0;
    background: none; border: 0; cursor: pointer; transition: transform 0.25s cubic-bezier(0.2, 1.4, 0.4, 1); }
  #home a.story:hover, #home button.game-card:hover { transform: translateY(-4px) rotate(-0.6deg); }
  #home .art { position: relative; aspect-ratio: 16 / 10; border-radius: 16px; background-size: cover; background-position: 60% 50%; background-color: #1a1622;
    box-shadow: 0 2px 0 rgba(255,244,214,0.18) inset, 0 14px 30px rgba(0,0,0,0.45); border: 3px solid #fbf6ea; }
  #home .num { position: absolute; left: 10px; top: 10px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(4,5,10,0.65); color: var(--gold); font-weight: 600; font-size: 0.85rem; border: 1px solid rgba(240,204,138,0.5); }
  #home h3 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 1.6rem; margin: 0.8rem 0 0.1rem; line-height: 1.1; }
  #home .ref { color: var(--soft); font-size: 0.85rem; margin: 0; }
  #home .progress { display: flex; align-items: center; gap: 12px; margin-top: 0.5rem; color: var(--soft); font-size: 0.82rem; }
  #home .progress .all { color: var(--gold); }
  #home .lamb-icon { display: inline-block; width: 16px; height: 16px; vertical-align: -3px; background: url("art/lamb.png") center / contain no-repeat; }
  #home .progress .sticker { border-width: 2px; }
  #home .continue { display: flex; align-items: center; gap: 18px; margin: 1.6rem 0 0; padding: 12px; border-radius: 20px; text-decoration: none; color: var(--ink);
    background: rgba(240,204,138,0.1); border: 1px solid rgba(240,204,138,0.45); max-width: 40rem; }
  #home .continue .art { width: 132px; flex: none; border-width: 2px; }
  #home .continue h2 { font-size: 1.7rem; margin: 0.15rem 0; }
  #home .continue .sub { margin: 0; font-size: 0.9rem; }
  #home .continue .words { flex: 1; min-width: 0; }
  #home .continue .go { color: var(--gold); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; padding-right: 8px; }
  #home .game-card .art { display: grid; place-items: center; }
  #home .game-card.locked { cursor: default; }
  #home .game-card.locked .art { filter: grayscale(0.85) brightness(0.55); }
  #home .credit { margin-top: 4rem; }
  @media (max-width: 560px) {
    #home .continue .go { display: none; }
    #home .continue .art { width: 96px; }
    #home .shelf { grid-template-columns: 1fr 1fr; gap: 20px 12px; }
    #home h3 { font-size: 1.25rem; }
    #home .art { border-width: 2px; border-radius: 12px; }
    #home .progress { gap: 8px; font-size: 0.75rem; }
  }

  /* Words light up as the narrator reads them. */
  .beat span { transition: color 0.25s, text-shadow 0.25s, opacity 0.4s; }
  .beat.reading span { opacity: 0.6; }
  .beat.reading span.said { opacity: 1; }
  .beat.reading span.saying { opacity: 1; color: #fff3d6; text-shadow: 0 0 18px rgba(255,226,160,0.75), 0 1px 18px rgba(0,0,0,0.55); }

  .starts { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 3rem; }
  .starts .begin { margin-top: 0; }
  .begin.read { background: rgba(240,204,138,0.16); }
  .all-stories { display: inline-block; margin-top: 2rem; color: var(--soft); font-size: 0.85rem; letter-spacing: 0.08em; text-decoration: none;
    border-bottom: 1px solid rgba(245,236,218,0.3); pointer-events: auto; }
  .all-stories:hover { color: var(--gold); border-color: var(--gold); }
  .more { margin-top: 2.2rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem 1.2rem; font-size: 0.95rem; }
  .more span { color: var(--soft); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; }
  .more a { color: var(--gold); font-style: italic; text-decoration: none; border-bottom: 1px solid rgba(240,204,138,0.4); }
  .more a:hover { border-color: var(--gold); }
  .at-cover #dots { opacity: 0; pointer-events: none; }
  .at-cover #next { animation: beckon-btn 2.4s ease-in-out infinite; }
  @keyframes beckon-btn { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

  /* "Tap here" invitation, placed by the stage. */
  #hint { position: fixed; z-index: 3; transform: translate(-50%, -50%); pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 0.9rem;
    opacity: 0; transition: opacity 0.8s ease; }
  #hint.on { opacity: 1; }
  #hint .dot { width: 18px; height: 18px; border-radius: 50%; background: #fff3d6;
    box-shadow: 0 0 18px 6px rgba(255,236,190,0.7), 0 0 60px 20px rgba(255,226,160,0.35);
    animation: beckon 2.2s ease-in-out infinite; }
  #hint .label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--gold); text-shadow: 0 1px 12px rgba(0,0,0,0.8); white-space: nowrap; }
  @keyframes beckon { 0%, 100% { transform: scale(0.8); opacity: 0.7; } 50% { transform: scale(1.25); opacity: 1; } }

  /* Phones: words sit low over a darker band, art fills the top. */
  @media (max-width: 760px) {
    #scrim { background: linear-gradient(0deg, rgba(4,5,10,0.9) 0%, rgba(4,5,10,0.6) 42%, rgba(4,5,10,0) 70%); }

    #nav { gap: 6px; }
    #nav button, #nav .navlink { width: 38px; height: 38px; }
    #nav svg { width: 16px; height: 16px; }

  }

  @media (prefers-reduced-motion: reduce) {

  }

</head>
