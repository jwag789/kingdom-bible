<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose the Narrator · Kingdom Bible</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #f5ecda; --soft: rgba(245,236,218,0.62); --gold: #f0cc8a; --night: #04050a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 70% 20%, #2a2440, var(--night) 70%); color: var(--ink);
    font-family: 'Literata', Georgia, serif; padding: 48px max(16px, 7vw); }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(2.4rem, 6vw, 3.6rem); margin: 0 0 0.4rem; }
  .line { font-style: italic; color: var(--soft); max-width: 40rem; margin: 0 0 1.6rem; line-height: 1.6; }
  label.mix { display: inline-flex; gap: 0.6rem; align-items: center; color: var(--soft); margin-bottom: 1.6rem; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; max-width: 40rem; }
  li { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border: 1px solid rgba(240,204,138,0.25);
    border-radius: 14px; background: rgba(4,5,10,0.35); }
  li.playing { border-color: var(--gold); background: rgba(240,204,138,0.1); }
  button { font: inherit; width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1px solid rgba(240,204,138,0.5);
    background: transparent; color: var(--gold); cursor: pointer; }
  .name { font-weight: 600; }
  .id { color: var(--soft); font-size: 0.85rem; }
</style>
</head>
<body>
<h1>Choose the narrator</h1>
<p class="line" id="line"></p>
<label class="mix"><input type="checkbox" id="mix" checked> Hear it in the story's mix (hall reverb and music)</label>
<ul id="list"></ul>
<script type="module">
import { Sound } from './src/audio.js';

const data = await (await fetch('audio/voices/voices.json')).json();
document.getElementById('line').textContent = `“${data.line}”`;
const sound = new Sound();
const el = new Audio();
let source = null, playing = null;

function wire() {
  sound.unlock();
  if (!source) { source = sound.ctx.createMediaElementSource(el); source.connect(sound.voiceBus); }
  const mix = document.getElementById('mix').checked;
  sound.setMood(mix ? 'dawn' : null);
  sound.setAmbience(mix ? ['wind'] : []);
  sound.musicBus.gain.value = mix ? 0.9 : 0;
}

for (const v of data.voices) {
  const li = document.createElement('li');
  li.innerHTML = `<button aria-label="Play">▶</button><div><div class="name"></div><div class="id"></div></div>`;
  li.querySelector('.name').textContent = v.label;
  li.querySelector('.id').textContent = v.voice;
  li.querySelector('button').onclick = () => {
    wire();
    document.querySelectorAll('li').forEach(x => { x.classList.remove('playing'); x.querySelector('button').textContent = '▶'; });
    if (playing === v) { el.pause(); playing = null; sound.duck(false); return; }
    playing = v;
    li.classList.add('playing');
    li.querySelector('button').textContent = '■';
    el.src = v.src;
    sound.duck(true);
    el.play();
    el.onended = () => { li.classList.remove('playing'); li.querySelector('button').textContent = '▶'; playing = null; sound.duck(false); };
  };
  document.getElementById('list').append(li);
}
</script>
</body>
</html>
